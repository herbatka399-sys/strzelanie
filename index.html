<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mazurek - Strzelanka w Lesie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="800"></canvas>
        <div id="ui">
            <div>Życie: <span id="health">100</span></div>
            <div>Broń: <span id="weapon">Pistolet</span></div>
            <div>Amunicja: <span id="ammo">∞</span></div>
            <div id="message"></div>
        </div>
        <div id="start-screen">
            <h1>MAZUREK - STRZELANKA W LESIE</h1>
            <p>Dotrzyj na koniec lasu!<br>
            Sterowanie: WASD / Strzałki – ruch<br>
            Mysz – celowanie i strzał<br>
            E – podnieś broń ze skrzynki</p>
            <button id="startBtn">START</button>
        </div>
        <div id="win-screen" class="hidden">
            <h1>WYGRAŁEŚ!</h1>
            <p>Dotarłeś na koniec lasu.<br>Czeka na Ciebie 5 dziewczyn z Sokudo.</p>
            <button id="restartBtn">Zagraj ponownie</button>
        </div>
        <div id="gameover-screen" class="hidden">
            <h1>PRZEGRAŁEŚ</h1>
            <button id="restartBtn2">Spróbuj jeszcze raz</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
